<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <style>
      .bg { fill: #f8f8f6; }
      .grid-line { stroke: #e8e6f0; stroke-width: 0.75; fill: none; }
      .silhouette { fill: #1a1a2e; opacity: 0.08; }
      .silhouette-face { fill: #1a1a2e; opacity: 0.06; }
      .node-ring { fill: none; stroke-width: 1.5; }
      .node-dot { }
      .node-label { font-family: 'Georgia', serif; font-size: 12px; fill: #1a1a2e; letter-spacing: 0.04em; }
      .node-label-small { font-family: 'Georgia', serif; font-size: 10px; fill: #555570; letter-spacing: 0.03em; }
      .spoke { stroke-width: 1; stroke-dasharray: 3 4; opacity: 0.5; }
      .center-ring { fill: none; stroke: #7253ed; stroke-width: 1.5; opacity: 0.2; }
      .title { font-family: 'Georgia', serif; font-size: 28px; fill: #1a1a2e; letter-spacing: 0.06em; }
      .subtitle { font-family: 'Georgia', serif; font-size: 13px; fill: #555570; letter-spacing: 0.08em; }
      .rule { stroke: #7253ed; stroke-width: 1; opacity: 0.35; }
      .overlay-tick { stroke: #7253ed; stroke-width: 0.75; fill: none; opacity: 0.4; }
      .measure-line { stroke: #2869e6; stroke-width: 0.75; fill: none; opacity: 0.35; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="400"/>

  <!-- Subtle grid overlay — fine measurement feel -->
  <g>
    <!-- Vertical grid lines -->
    <line class="grid-line" x1="100" y1="0" x2="100" y2="400"/>
    <line class="grid-line" x1="200" y1="0" x2="200" y2="400"/>
    <line class="grid-line" x1="300" y1="0" x2="300" y2="400"/>
    <line class="grid-line" x1="400" y1="0" x2="400" y2="400"/>
    <line class="grid-line" x1="500" y1="0" x2="500" y2="400"/>
    <line class="grid-line" x1="600" y1="0" x2="600" y2="400"/>
    <line class="grid-line" x1="700" y1="0" x2="700" y2="400"/>
    <line class="grid-line" x1="800" y1="0" x2="800" y2="400"/>
    <line class="grid-line" x1="900" y1="0" x2="900" y2="400"/>
    <line class="grid-line" x1="1000" y1="0" x2="1000" y2="400"/>
    <line class="grid-line" x1="1100" y1="0" x2="1100" y2="400"/>
    <!-- Horizontal grid lines -->
    <line class="grid-line" x1="0" y1="80" x2="1200" y2="80"/>
    <line class="grid-line" x1="0" y1="160" x2="1200" y2="160"/>
    <line class="grid-line" x1="0" y1="240" x2="1200" y2="240"/>
    <line class="grid-line" x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Abstract head silhouette — center of canvas, geometric, minimal -->
  <!-- Crown of head -->
  <ellipse cx="600" cy="160" rx="68" ry="80" class="silhouette"/>
  <!-- Neck -->
  <rect x="582" y="228" width="36" height="40" class="silhouette" rx="4"/>
  <!-- Shoulders suggestion -->
  <ellipse cx="600" cy="285" rx="110" ry="28" class="silhouette"/>

  <!-- Measurement overlay on face — golden ratio calipers suggestion -->
  <!-- Horizontal measurement lines across face -->
  <line class="measure-line" x1="530" y1="145" x2="670" y2="145"/>
  <line class="measure-line" x1="540" y1="170" x2="660" y2="170"/>
  <line class="measure-line" x1="548" y1="195" x2="652" y2="195"/>
  <!-- Vertical center axis -->
  <line class="measure-line" x1="600" y1="90" x2="600" y2="260"/>
  <!-- Tick marks -->
  <line class="overlay-tick" x1="530" y1="141" x2="530" y2="149"/>
  <line class="overlay-tick" x1="670" y1="141" x2="670" y2="149"/>
  <line class="overlay-tick" x1="540" y1="166" x2="540" y2="174"/>
  <line class="overlay-tick" x1="660" y1="166" x2="660" y2="174"/>
  <line class="overlay-tick" x1="548" y1="191" x2="548" y2="199"/>
  <line class="overlay-tick" x1="652" y1="191" x2="652" y2="199"/>
  <!-- Small crosshair at eye level -->
  <line class="overlay-tick" x1="558" y1="163" x2="572" y2="163"/>
  <line class="overlay-tick" x1="565" y1="156" x2="565" y2="170"/>
  <line class="overlay-tick" x1="628" y1="163" x2="642" y2="163"/>
  <line class="overlay-tick" x1="635" y1="156" x2="635" y2="170"/>

  <!-- Constellation spokes from center -->
  <!-- Center of constellation = center of figure (600, 200) -->
  <!-- 8 pillar nodes arranged in ellipse -->

  <!-- Spoke to SKIN (top, slight left): 540, 58 -->
  <line class="spoke" stroke="#7253ed" x1="600" y1="200" x2="540" y2="68"/>
  <!-- Spoke to HAIR (top right): 680, 65 -->
  <line class="spoke" stroke="#7253ed" x1="600" y1="200" x2="690" y2="68"/>
  <!-- Spoke to BODY (right): 870, 175 -->
  <line class="spoke" stroke="#2869e6" x1="600" y1="200" x2="860" y2="175"/>
  <!-- Spoke to DENTAL (lower right): 790, 330 -->
  <line class="spoke" stroke="#2869e6" x1="600" y1="200" x2="790" y2="338"/>
  <!-- Spoke to STYLE (lower left): 420, 338 -->
  <line class="spoke" stroke="#10ac7d" x1="600" y1="200" x2="420" y2="338"/>
  <!-- Spoke to POSTURE (left): 330, 175 -->
  <line class="spoke" stroke="#10ac7d" x1="600" y1="200" x2="340" y2="175"/>
  <!-- Spoke to SLEEP (upper left): 400, 68 -->
  <line class="spoke" stroke="#d93c3c" x1="600" y1="200" x2="400" y2="72"/>
  <!-- Spoke to MENTAL (lower center): 600, 370 -->
  <line class="spoke" stroke="#d93c3c" x1="600" y1="200" x2="610" y2="365"/>

  <!-- Center concentric rings -->
  <circle class="center-ring" cx="600" cy="200" r="40"/>
  <circle class="center-ring" cx="600" cy="200" r="70" opacity="0.12"/>
  <circle class="center-ring" cx="600" cy="200" r="100" opacity="0.08"/>

  <!-- === PILLAR NODES === -->

  <!-- SKIN — top left area -->
  <circle cx="540" cy="58" r="22" fill="#7253ed" opacity="0.12"/>
  <circle cx="540" cy="58" r="14" fill="#7253ed" opacity="0.22"/>
  <circle cx="540" cy="58" r="6" fill="#7253ed"/>
  <circle cx="540" cy="58" r="22" class="node-ring" stroke="#7253ed" opacity="0.5"/>
  <text x="540" y="32" class="node-label" text-anchor="middle" fill="#7253ed" font-weight="600">SKIN</text>
  <text x="540" y="44" class="node-label-small" text-anchor="middle">care &amp; texture</text>

  <!-- HAIR — top right area -->
  <circle cx="690" cy="58" r="22" fill="#7253ed" opacity="0.12"/>
  <circle cx="690" cy="58" r="14" fill="#7253ed" opacity="0.22"/>
  <circle cx="690" cy="58" r="6" fill="#7253ed"/>
  <circle cx="690" cy="58" r="22" class="node-ring" stroke="#7253ed" opacity="0.5"/>
  <text x="690" y="32" class="node-label" text-anchor="middle" fill="#7253ed" font-weight="600">HAIR</text>
  <text x="690" y="44" class="node-label-small" text-anchor="middle">health &amp; style</text>

  <!-- BODY — right -->
  <circle cx="860" cy="175" r="22" fill="#2869e6" opacity="0.12"/>
  <circle cx="860" cy="175" r="14" fill="#2869e6" opacity="0.22"/>
  <circle cx="860" cy="175" r="6" fill="#2869e6"/>
  <circle cx="860" cy="175" r="22" class="node-ring" stroke="#2869e6" opacity="0.5"/>
  <text x="896" y="170" class="node-label" text-anchor="start" fill="#2869e6" font-weight="600">BODY</text>
  <text x="896" y="183" class="node-label-small" text-anchor="start">composition</text>

  <!-- DENTAL — lower right -->
  <circle cx="790" cy="338" r="22" fill="#2869e6" opacity="0.12"/>
  <circle cx="790" cy="338" r="14" fill="#2869e6" opacity="0.22"/>
  <circle cx="790" cy="338" r="6" fill="#2869e6"/>
  <circle cx="790" cy="338" r="22" class="node-ring" stroke="#2869e6" opacity="0.5"/>
  <text x="820" y="333" class="node-label" text-anchor="start" fill="#2869e6" font-weight="600">DENTAL</text>
  <text x="820" y="346" class="node-label-small" text-anchor="start">hygiene &amp; aesthetics</text>

  <!-- STYLE — lower left -->
  <circle cx="420" cy="338" r="22" fill="#10ac7d" opacity="0.12"/>
  <circle cx="420" cy="338" r="14" fill="#10ac7d" opacity="0.22"/>
  <circle cx="420" cy="338" r="6" fill="#10ac7d"/>
  <circle cx="420" cy="338" r="22" class="node-ring" stroke="#10ac7d" opacity="0.5"/>
  <text x="387" y="333" class="node-label" text-anchor="end" fill="#10ac7d" font-weight="600">STYLE</text>
  <text x="387" y="346" class="node-label-small" text-anchor="end">fit &amp; dress</text>

  <!-- POSTURE — left -->
  <circle cx="340" cy="175" r="22" fill="#10ac7d" opacity="0.12"/>
  <circle cx="340" cy="175" r="14" fill="#10ac7d" opacity="0.22"/>
  <circle cx="340" cy="175" r="6" fill="#10ac7d"/>
  <circle cx="340" cy="175" r="22" class="node-ring" stroke="#10ac7d" opacity="0.5"/>
  <text x="306" y="170" class="node-label" text-anchor="end" fill="#10ac7d" font-weight="600">POSTURE</text>
  <text x="306" y="183" class="node-label-small" text-anchor="end">&amp; alignment</text>

  <!-- SLEEP — upper left -->
  <circle cx="400" cy="72" r="22" fill="#d93c3c" opacity="0.12"/>
  <circle cx="400" cy="72" r="14" fill="#d93c3c" opacity="0.22"/>
  <circle cx="400" cy="72" r="6" fill="#d93c3c"/>
  <circle cx="400" cy="72" r="22" class="node-ring" stroke="#d93c3c" opacity="0.5"/>
  <text x="400" y="32" class="node-label" text-anchor="middle" fill="#d93c3c" font-weight="600">SLEEP</text>
  <text x="400" y="44" class="node-label-small" text-anchor="middle">recovery &amp; repair</text>

  <!-- MENTAL — bottom center -->
  <circle cx="610" cy="365" r="22" fill="#d93c3c" opacity="0.12"/>
  <circle cx="610" cy="365" r="14" fill="#d93c3c" opacity="0.22"/>
  <circle cx="610" cy="365" r="6" fill="#d93c3c"/>
  <circle cx="610" cy="365" r="22" class="node-ring" stroke="#d93c3c" opacity="0.5"/>
  <text x="646" y="361" class="node-label" text-anchor="start" fill="#d93c3c" font-weight="600">MENTAL</text>
  <text x="646" y="374" class="node-label-small" text-anchor="start">health &amp; confidence</text>

  <!-- Title block — right panel -->
  <line x1="960" y1="100" x2="960" y2="300" class="rule"/>
  <text x="990" y="148" class="title">Evidence-Based</text>
  <text x="990" y="182" class="title">Looksmaxxing</text>
  <line x1="990" y1="196" x2="1160" y2="196" stroke="#7253ed" stroke-width="1" opacity="0.4"/>
  <text x="990" y="218" class="subtitle">A systematic approach to</text>
  <text x="990" y="234" class="subtitle">male aesthetic optimisation</text>
  <text x="990" y="254" class="subtitle" fill="#7253ed" opacity="0.7">8 evidence-based pillars</text>

</svg>
