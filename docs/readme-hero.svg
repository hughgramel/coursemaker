<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="coursemaker: ten weeks, one curriculum graph">
  <rect width="1200" height="360" fill="#f7f4ee"/>

  <!-- Phase bands across the bottom (faint) -->
  <g opacity="0.10" fill="#7253ed">
    <rect x="100" y="270" width="180" height="6" rx="3"/>
    <rect x="290" y="270" width="280" height="6" rx="3"/>
    <rect x="580" y="270" width="200" height="6" rx="3"/>
    <rect x="790" y="270" width="200" height="6" rx="3"/>
    <rect x="1000" y="270" width="100" height="6" rx="3"/>
  </g>

  <!-- Connecting curves: knowledge transfer between weeks -->
  <g stroke="#c4b8f1" stroke-width="1.25" fill="none" opacity="0.85">
    <path d="M 130 230 C 180 200, 210 200, 230 230"/>
    <path d="M 230 230 C 280 180, 310 180, 330 230"/>
    <path d="M 330 230 C 380 170, 410 170, 430 230"/>
    <path d="M 430 230 C 480 160, 510 160, 530 230"/>
    <path d="M 530 230 C 580 150, 610 150, 630 230"/>
    <path d="M 630 230 C 680 140, 710 140, 730 230"/>
    <path d="M 730 230 C 780 135, 810 135, 830 230"/>
    <path d="M 830 230 C 880 130, 910 130, 930 230"/>
    <path d="M 930 230 C 980 125, 1010 125, 1030 230"/>
  </g>

  <!-- Week nodes: gradient from light to primary, growing slightly -->
  <g>
    <circle cx="130"  cy="230" r="6"  fill="#cdc0f3" stroke="#7253ed" stroke-width="1.2"/>
    <circle cx="230"  cy="230" r="6"  fill="#cdc0f3" stroke="#7253ed" stroke-width="1.2"/>
    <circle cx="330"  cy="230" r="6.5" fill="#a594ec" stroke="#7253ed" stroke-width="1.2"/>
    <circle cx="430"  cy="230" r="6.5" fill="#a594ec" stroke="#7253ed" stroke-width="1.2"/>
    <circle cx="530"  cy="230" r="6.5" fill="#a594ec" stroke="#7253ed" stroke-width="1.2"/>
    <circle cx="630"  cy="230" r="7"   fill="#8a72e8" stroke="#7253ed" stroke-width="1.2"/>
    <circle cx="730"  cy="230" r="7"   fill="#8a72e8" stroke="#7253ed" stroke-width="1.2"/>
    <circle cx="830"  cy="230" r="7"   fill="#7253ed" stroke="#7253ed" stroke-width="1.2"/>
    <circle cx="930"  cy="230" r="7"   fill="#7253ed" stroke="#7253ed" stroke-width="1.2"/>
    <circle cx="1030" cy="230" r="8.5" fill="#7253ed" stroke="#5739ce" stroke-width="1.5"/>
  </g>

  <!-- Week numbers under nodes -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle">
    <text x="130"  y="260">1</text>
    <text x="230"  y="260">2</text>
    <text x="330"  y="260">3</text>
    <text x="430"  y="260">4</text>
    <text x="530"  y="260">5</text>
    <text x="630"  y="260">6</text>
    <text x="730"  y="260">7</text>
    <text x="830"  y="260">8</text>
    <text x="930"  y="260">9</text>
    <text x="1030" y="260">10</text>
  </g>

  <!-- Phase labels above bands -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#7253ed" font-weight="600" letter-spacing="1.5" text-anchor="middle">
    <text x="190"  y="305">FOUNDATIONS</text>
    <text x="430"  y="305">CORE MECHANICS</text>
    <text x="680"  y="305">COMPOSITION</text>
    <text x="890"  y="305">FRONTIER</text>
    <text x="1050" y="305">SYNTHESIS</text>
  </g>

  <!-- Headline -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" fill="#27262b">
    <text x="100" y="90" font-size="44" font-weight="300" letter-spacing="-0.5">coursemaker</text>
    <text x="100" y="135" font-size="18" font-weight="400" fill="#5c5962">
      Publishable course websites, end-to-end, from one prompt.
    </text>
    <text x="100" y="165" font-size="14" font-weight="400" fill="#8a8a8a">
      Curriculum graph · primary-source readings · slide PDFs · daily working rhythm
    </text>
  </g>
</svg>
